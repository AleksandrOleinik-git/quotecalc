# Production-style stack: PHP-FPM app + Nginx. Put TLS in front (Caddy, Traefik or a managed load balancer).
#   cp .env.example .env.production   # set APP_KEY, APP_URL, QUOTECALC_API_KEY, MAIL_* ...
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed --force   # first run only
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
    volumes:
      - sqlite:/var/www/html/database/data
      - storage:/var/www/html/storage/app
      - public:/var/www/public-shared

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro

volumes:
  sqlite:
  storage:
  public:
